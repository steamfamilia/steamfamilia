<button id="przycisk">Włącz muzykę</button>
<audio id="muzyka" src="media/roundabout.mp3" loop></audio>

<script>
  const audio = document.getElementById("muzyka");
  const przycisk = document.getElementById("przycisk");

  przycisk.addEventListener("click", () => {
    if (audio.paused) {
      audio.play();
      przycisk.textContent = "Wyłącz muzykę";
    } else {
      audio.pause();
      przycisk.textContent = "Włącz muzykę";
    }
  });
</script><br>
